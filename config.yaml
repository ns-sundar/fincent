# =====================================================================
# Fincent application configuration
#
# All values can be overridden by environment variables of the same
# (uppercased) name, e.g. FINCENT__LLM__MODEL=gpt-5.4-mini.
# =====================================================================

app:
  name: "Fincent"
  version: "0.1.0"
  description: "Your Personal Financial Assistant (educational, not professional)"
  # Owner/about info exposed to the central agent for self-describing
  # answers ("What can this app do?").
  about: >
    Fincent is a personal financial assistant that can answer questions about stocks, bonds,
    cash, ETFs, mutual funds, general portfolio theory, investment risk, market trading,
    brokers, general IRS/tax topics, and portfolio-grounded goal planning. For portfolio
    and goal-planning questions, Fincent uses the configured portfolio account, holding,
    and transaction data available to the app.
    Fincent has access only to the portfolio uploaded by the user. It uses a sample portfolio 
    for demo purposes till the user uploads their own portfolio.
  tools: 
    - name: "openbb"
      description: "OpenBB platform for financial data and analysis."
    - name: "fincent-rag"
      description: "A curated knowledge base about stocks, bonds, cash, ETFs, mutual funds, general portfolio theory, investment risk, market trading, brokers, and general IRS/tax topics."
    - name: "alpha-vantage"
      description: "Alpha Vantage market data, technical indicators, and market sentiment."
    - name: "tavily"
      description: "Tavily web search for current market, company, and AI investment research."
    - name: "financial-modeling-prep"
      description: "Financial Modeling Prep company fundamentals, filings, and 10-K risk analysis."
    - name: "fincent-goal-planning"
      description: "Internal planning math, Monte Carlo simulations, and portfolio summary context for goal planning."

llm:
  provider: "openai"
  # Default chat model used by every agent unless they override it.
  model: "gpt-5.4-mini"
  temperature: 0.1
  # Max tokens for each individual LLM call.
  max_tokens: 1024
  # Per-call timeout in seconds.
  request_timeout: 60
  # When the primary model returns an OpenAI rate limit, retry with this model.
  rate_limit_fallback_model: "gpt-5.4"

server:
  host: "0.0.0.0"
  port: 8000
  # Path prefix mounted by LangServe for the compiled graph.
  graph_path: "/fincent"
  # CORS origins for the FastAPI app.
  cors_origins:
    - "*"
  # Max seconds to wait for GET /health while FastAPI starts. RAG ingestion
  # runs in the ASGI lifespan before the app serves; keep this >= worst-case
  # ingestion time. Used by scripts/docker-entrypoint.sh; Dockerfile
  # HEALTHCHECK start-period should match.
  startup_health_wait_seconds: 900
  # Docker HEALTHCHECK: seconds between probes after the start-period (steady
  # state). The Dockerfile hardcodes this; override via rebuild or edit Dockerfile.
  healthcheck_interval_seconds: 90

ui:
  # The Streamlit process talks to the FastAPI server via this URL.
  api_base_url: "http://localhost:8000"
  page_title: "Fincent"
  page_icon: "FC"

agents:
  central:
    enabled: true
    # Maximum number of specialist agents the central router may
    # dispatch in parallel for a single query.
    max_fanout: 3
  qna:
    enabled: true
    description: >
      Answers generic (non-personal) financial questions about stocks,
      bonds, cash, ETFs, mutual funds, general portfolio theory,
      investment risk, market trading, brokers, and general IRS/tax
      topics. Refuses personal-finance, personal-portfolio, live
      market data, planning advice, and personal tax advice.
  portfolio:
    enabled: true
    description: >
      Answers questions grounded in the user's own portfolio: the list
      of accounts, current holdings, balances, asset-class allocation
      (stocks / bonds / cash), and recent transaction activity. Data is
      loaded from the static JSON files under
      ``portfolio.data_path`` until live account connectivity is wired.
  market_research:
    enabled: true
    description: >
      Answers non-personal market research questions about companies,
      securities, sectors, investment risks, and financial statements.
      Uses market data, technical indicators, web search, sentiment,
      and company filings to explain investment tradeoffs in simple
      educational language.
  goal_planning:
    enabled: true
    description: >
      Helps users map their portfolio and savings capacity to financial
      goals such as retirement, college, home purchase, vacation, and
      recession stress tests. Uses deterministic TVM math, Monte Carlo
      simulations, portfolio allocation context, and educational funding
      waterfall guidance.

rag:
  # Retrieval-Augmented Generation for the Q&A agent.
  #
  # Ingestion runs inside the FastAPI lifespan (startup). FastAPI does
  # not begin serving requests until ingestion either (a) completes
  # successfully, or (b) fails -- in which case the API still starts
  # but /rag/status reports the failure and the Streamlit UI renders
  # a banner while still accepting queries.
  enabled: true
  # JSON catalog of documents to ingest. Path is relative to the
  # project root. Schema: [{"url": str, "title": str,
  # "tags": {"source": str, "category": [str, ...]}}, ...]
  articles_path: "rag/fincent_rag_articles.json"
  # Absolute path on the host filesystem; HF Spaces mounts /data, and
  # locally you must provide /data (or override via
  # FINCENT__RAG__VECTOR_DB_PATH). If an index exists here, ingestion
  # is skipped (the catalog is assumed static).
  vector_db_path: "/data/vector_db"
  # Embedding model for both ingestion and query-time retrieval.
  embedding_model: "text-embedding-3-small"
  # Recursive character chunker calibrated on the cl100k_base tokenizer.
  chunk_size: 1000
  chunk_overlap: 200
  # HTTP client settings for downloading source documents.
  request_timeout: 60
  # Many gov / finance sites (investor.gov, cbp.gov, usitc.gov,
  # investopedia.com, finra.org ...) block non-browser User-Agents
  # with a 403. We default to a realistic Chrome UA; the loader
  # additionally sends browser-class Accept / Accept-Language /
  # Sec-Fetch-* / Referer headers and retries once on 403/429/5xx.
  user_agent: "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36"
  # Retrieval fan-out at query time.
  top_k: 5
  # MMR (Maximal Marginal Relevance) re-ranking: trades some similarity
  # for diversity so the top-k is not three near-duplicate chunks.
  use_mmr: true
  # Candidate pool size for MMR before re-ranking down to top_k.
  mmr_fetch_k: 20
  # Diversity / relevance knob in [0, 1]. 1.0 == pure similarity,
  # 0.0 == maximise diversity only.
  mmr_lambda: 0.5
  # MCP sidecar: publish the FAISS vector_db as a tool on the Model
  # Context Protocol. Off by default -- run via:
  #   python -m src.rag.mcp_server
  # or set FINCENT__RAG__MCP_SERVER__ENABLED=true to have the entrypoint
  # supervise it alongside FastAPI + Streamlit.
  mcp_server:
    enabled: false
    # "stdio" (client-spawned local servers) or "streamable-http"
    # (long-lived HTTP server, successor to the deprecated SSE
    # transport; endpoint is /mcp on host:port).
    transport: "stdio"
    host: "127.0.0.1"
    port: 8765
    tool_name: "rag_search"

portfolio:
  # The Portfolio agent reads the user's portfolio from JSON files
  # (``accounts.json`` and ``transactions.json``) under ``data_path``.
  # On startup the app copies every JSON from ``seed_path`` into
  # ``data_path`` IF the file is missing there, so a fresh deployment
  # lands with a working default portfolio while in-place edits to
  # ``data_path`` survive restarts.
  #
  # ``data_path`` is absolute by default (same ``/data`` mount used by
  # the SQLite checkpointer and the FAISS vector_db). HF Spaces mounts
  # ``/data`` for you; local dev must provide it, or override via
  # FINCENT__PORTFOLIO__DATA_PATH.
  data_path: "/data/portfolio"
  # Repo-relative read-only seed. Do not edit at runtime -- it is the
  # canonical "default user" snapshot shipped with the code.
  seed_path: "data/default_portfolio"
  # MCP tool servers the Portfolio agent can invoke when answering a
  # question. Tools are loaded lazily on first use via langchain-
  # mcp-adapters and cached for the process lifetime. Each spec
  # describes a stdio MCP server; the agent will spawn a subprocess
  # per tool call (stateless sessions). Flip ``enabled: false`` to
  # skip loading a given server; if all servers are disabled the
  # agent falls back to the legacy direct-LLM answer path.
  tools:
    # OpenBB Platform MCP server -- real-world financial data backed
    # by yfinance + SEC + FRED + other free providers out of the box.
    # Command is whatever ``openbb-mcp`` resolves to on $PATH (the
    # ``openbb-mcp-server`` pip package installs it).
    openbb:
      enabled: true
      command: "openbb-mcp"
      # Restrict the advertised tool categories so the LLM does not
      # see hundreds of tools at once. Override for broader access.
      args:
        - "--transport"
        - "stdio"
        - "--default-categories"
        - "equity,news,etf,currency,economy,crypto"
      env: {}
    # Fincent's own RAG MCP server (same FAISS vector_db the Q&A
    # agent queries). Spawned as a stdio subprocess so no extra port
    # management is required.
    rag:
      enabled: true
      command: "python"
      args:
        - "-m"
        - "src.rag.mcp_server"
      env:
        FINCENT__RAG__MCP_SERVER__TRANSPORT: "stdio"

market_research:
  # FMP tools whose names contain these substrings are not offered to the
  # agent. The default keeps all FMP tools so a configured FMP Starter (or
  # higher) key can use paid endpoints such as five-year historical data.
  # Add substrings here if a specific FMP tool is noisy for your plan.
  fmp_exclude_tool_name_substrings: []
  # MCP tool servers the Market Research agent can invoke for
  # non-personal company, security, market, and filing analysis.
  # Secrets are intentionally represented as ${ENV_VAR} placeholders
  # and resolved from the FastAPI process environment by the loader.
  tools:
    openbb:
      enabled: true
      command: "openbb-mcp"
      args:
        - "--transport"
        - "stdio"
        - "--default-categories"
        - "equity,news,etf,economy"
      env: {}
    alpha_vantage:
      # Disabled by default for Docker/HF stability: marketdata-mcp-server
      # currently requires Python >=3.13 while this image runs Python 3.11.
      enabled: false
      command: "marketdata-mcp-server"
      args:
        - "${ALPHA_VANTAGE_API_KEY}"
      env: {}
    tavily:
      # Disabled by default for Docker/HF stability: Fincent adds lightweight
      # native Python Tavily tools when TAVILY_API_KEY is set, so the npm MCP
      # server is only needed for custom deployments that specifically want it.
      enabled: false
      command: "tavily-mcp"
      args: []
      env:
        TAVILY_API_KEY: "${TAVILY_API_KEY}"
    fmp:
      enabled: true
      command: "python"
      args:
        - "-m"
        - "fmp.server"
      env:
        FMP_ACCESS_TOKEN: "${FMP_ACCESS_TOKEN}"
        FMP_API_KEY: "${FMP_ACCESS_TOKEN}"
        DYNAMIC_TOOL_DISCOVERY: "true"

goal_planning:
  # Bounded defaults keep simulations responsive in local dev and HF Spaces.
  monte_carlo_simulations: 5000
  max_monte_carlo_simulations: 20000
  max_projection_years: 60
  default_inflation_rate: 0.025
  default_risk_free_rate: 0.04
  tools:
    internal:
      enabled: true
      command: "python"
      args:
        - "-m"
        - "src.agents.goal_planning.mcp_server"
      env: {}
    openbb:
      enabled: true
      command: "openbb-mcp"
      args:
        - "--transport"
        - "stdio"
        - "--default-categories"
        - "economy"
      env: {}

checkpointer:
  # LangGraph persists the per-thread state (messages, plan, etc.) so
  # that Streamlit can rehydrate on reload. Only the sqlite backend is
  # wired today. Use ":memory:" for ephemeral storage (tests, CI).
  #
  # Absolute path: filesystem root ``/data``, NOT ``./data`` in the repo.
  # HF Spaces mounts ``/data``; local env should provide it or override
  # via FINCENT__CHECKPOINTER__PATH.
  backend: "sqlite"
  path: "/data/checkpoints.sqlite"

logging:
  level: "INFO"
  # Optional path; leave empty to log only to stderr.
  file: ""
