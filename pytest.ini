[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
# faiss-cpu pulls in SWIG bindings that trigger DeprecationWarning on
# Python 3.12+ ("builtin type SwigPyPacked/SwigPyObject/swigvarlink has
# no __module__ attribute") during importlib bootstrap. The warning is
# outside our code; suppress it so CI output stays clean.
filterwarnings =
    ignore:builtin type SwigPyPacked has no __module__:DeprecationWarning
    ignore:builtin type SwigPyObject has no __module__:DeprecationWarning
    ignore:builtin type swigvarlink has no __module__:DeprecationWarning
    # unstructured / torch stack on CPU-only hosts (no NVIDIA driver).
    ignore:Can't initialize NVML:UserWarning
